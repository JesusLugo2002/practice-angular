<section class="card">
  <h2>Lista de tareas</h2>

  @if (tasks.length === 0) {
  <p>No hay tareas todavía.</p>
  } @else {
  <ul class="list">
    @for (t of tasks; track t.id) {
    <li class="item">
      <div>
        <strong>{{ t.title }}</strong>
        @if (t.description) {
        <div class="muted">{{ t.description }}</div>
        }
      </div>

      <button class="btn" (click)="remove(t.id)">Eliminar</button>
    </li>
    }
  </ul>
  }
</section>
