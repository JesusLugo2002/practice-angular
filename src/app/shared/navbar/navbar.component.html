<nav class="nav">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
  @if (auth.isLoggedIn()) {
    <a routerLink="/tareas" routerLinkActive="active">Tareas</a>
    <a routerLink="/tareas/nueva" routerLinkActive="active">Nueva tarea</a>
    <button class="btn btn-outline-danger" (click)="auth.logout()">Logout</button>
  } @else {
    <a routerLink="/login" routerLinkActive="active" class="btn">Login</a>
  }
</nav>
