<h2>Login</h2>

<form (ngSubmit)="validate()" class="form-control" [formGroup]="authenticationForm">
  <label>Usuario</label>
  <input name="username" formControlName="username" required class="form-control"/>
  <label>Contraseña</label>
  <input type="password" name="password" formControlName="password" required class="form-control"/>
  <button type="submit" class="btn btn-success mt-3">Entrar</button>
  <p ngIf="error">{{ error }}</p>
</form>
